<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Peso Money Counter</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f3f6f1;--surface:#ffffff;--ink:#14231a;--muted:#5b6b60;--line:#d5ddd3;--accent:#1f6b43;--accent-ink:#ffffff;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg:#0f1a14;--surface:#172620;--ink:#e8f0ea;--muted:#9bb0a2;--line:#2b3d33;--accent:#5fc78f;--accent-ink:#0b1a12}
}
:root[data-theme="dark"]{--bg:#0f1a14;--surface:#172620;--ink:#e8f0ea;--muted:#9bb0a2;--line:#2b3d33;--accent:#5fc78f;--accent-ink:#0b1a12}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;line-height:1.5}
main{max-width:560px;margin:0 auto;padding:28px 20px 48px}
h1{font-size:clamp(2rem,8vw,3rem);font-weight:800;line-height:1.05;margin:0 0 8px;letter-spacing:-.02em}
.sub{color:var(--muted);margin:0 0 20px}
.sum{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:12px 0;margin-bottom:8px;border-bottom:2px solid var(--ink);display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.sum .big{font-size:2.4rem;font-weight:800;line-height:1}
.sum .lbl{color:var(--muted);font-size:.9rem}
.sum .r{text-align:right}
.sum .r b{font-size:1.3rem}
.row{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px 12px;background:var(--surface);border:1px solid var(--line);border-left:8px solid var(--c);border-radius:10px;padding:10px 12px;margin-bottom:8px}
.d{font-weight:800;font-size:1.3rem}
.line{color:var(--muted);font-size:.9rem}
.ctl{display:flex;align-items:center;gap:6px}
.n{min-width:2.6ch;text-align:center;font-weight:800;font-size:1.25rem}
.ctl button{width:44px;height:44px;border-radius:10px;border:2px solid var(--accent);background:transparent;color:var(--accent);font:inherit;font-size:1.5rem;font-weight:800;line-height:1;cursor:pointer;padding:0}
.ctl button.plus{background:var(--accent);color:var(--accent-ink)}
.ctl button:disabled{opacity:.3;cursor:not-allowed}
button:focus-visible{outline:3px solid var(--ink);outline-offset:2px}
#reset{margin-top:12px;width:100%;height:46px;font:inherit;font-weight:600;border-radius:10px;border:2px solid var(--line);background:transparent;color:var(--ink);cursor:pointer}
</style>
</head>
<body>
<main>
  <h1>Peso Money Counter</h1>
  <p class="sub">Tap + or − to add or remove paper bills and coins.</p>

  <div class="sum" aria-live="polite">
    <div><div class="lbl">Total amount</div><div class="big" id="total">₱0</div></div>
    <div class="r"><div class="lbl">Total pieces</div><b id="pieces">0</b></div>
  </div>

  <div id="list"></div>
  <button id="reset" type="button">Reset all</button>
</main>
<script>
var DENOMS=[1000,500,200,100,50,20,10,5,1];
var COLORS={1000:"#2f6fd0",500:"#e0b400",200:"#2e9d57",100:"#8a4fc9",50:"#d6475f",20:"#e8802a",10:"#8a97a0",5:"#8a97a0",1:"#8a97a0"};
var MAX=999;
var counts={};DENOMS.forEach(function(d){counts[d]=0});
var fmt=function(n){return n.toLocaleString("en-PH")};
var list=document.getElementById("list");

DENOMS.forEach(function(d){
  var row=document.createElement("div");
  row.className="row";row.style.setProperty("--c",COLORS[d]);
  row.innerHTML='<div><div class="d">₱'+fmt(d)+'</div><div class="line" id="s'+d+'">₱0</div></div>'+
    '<div class="ctl"><button type="button" id="m'+d+'" aria-label="Remove one ₱'+d+'">−</button>'+
    '<div class="n" id="n'+d+'">0</div>'+
    '<button type="button" class="plus" id="p'+d+'" aria-label="Add one ₱'+d+'">+</button></div>';
  list.appendChild(row);
  document.getElementById("m"+d).onclick=function(){change(d,-1)};
  document.getElementById("p"+d).onclick=function(){change(d,1)};
});

function change(d,delta){
  counts[d]=Math.max(0,Math.min(MAX,counts[d]+delta));
  render();
}
function render(){
  var total=0,pieces=0;
  DENOMS.forEach(function(d){
    var n=counts[d];total+=n*d;pieces+=n;
    document.getElementById("n"+d).textContent=n;
    document.getElementById("s"+d).textContent="₱"+fmt(n*d);
    document.getElementById("m"+d).disabled=n===0;
    document.getElementById("p"+d).disabled=n===MAX;
  });
  document.getElementById("total").textContent="₱"+fmt(total);
  document.getElementById("pieces").textContent=fmt(pieces);
}
document.getElementById("reset").onclick=function(){DENOMS.forEach(function(d){counts[d]=0});render()};
render();
</script>
</body>
</html>
